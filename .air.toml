# Air: live reload untuk development. Jalankan dengan `make dev`.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/app"
  entrypoint = ["./tmp/main"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "db", "secrets", ".git", ".idea"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
